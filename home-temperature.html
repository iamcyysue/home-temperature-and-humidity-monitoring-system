<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arduino 溫濕度監測器</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            text-align: center;
            padding: 50px 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #0078D7;
            font-size: 24px;
        }
        .data-box {
            font-size: 32px;
            font-weight: bold;
            margin: 20px 0;
            padding: 20px;
            background: #e9f5ff;
            border-radius: 8px;
            color: #005a9e;
        }
        button {
            background-color: #0078D7;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
            margin: 5px;
        }
        button:hover {
            background-color: #005a9e;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>屋企溫濕度監測</h1>
    <div class="data-box" id="dataDisplay">等待連接...</div>
    
    <button id="connectBtn">連接 Arduino</button>
    <button id="disconnectBtn" disabled>斷開連接</button>
    
    <div id="status">狀態: 未連接</div>
</div>

<script>
    // 呢度嘅 UUID 必須同 Arduino code 入面嘅一模一樣 (Web Bluetooth 要求全小寫)
    const serviceUuid = "19b10000-e8f2-537e-4f6c-d104768a1214";
    const characteristicUuid = "19b10001-e8f2-537e-4f6c-d104768a1214";

    let bluetoothDevice;
    let characteristic;

    const connectBtn = document.getElementById('connectBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const dataDisplay = document.getElementById('dataDisplay');
    const statusText = document.getElementById('status');

    connectBtn.addEventListener('click', async () => {
        try {
            statusText.innerText = '狀態: 正在搜尋裝置...';
            
            // 要求連接藍牙裝置 (過濾名稱為 Nano33_Weather)
            bluetoothDevice = await navigator.bluetooth.requestDevice({
                filters: [{ name: 'Nano33_Weather' }],
                optionalServices: [serviceUuid]
            });

            // 監聽斷線事件
            bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

            statusText.innerText = '狀態: 正在連接...';
            const server = await bluetoothDevice.gatt.connect();

            statusText.innerText = '狀態: 正在獲取服務...';
            const service = await server.getPrimaryService(serviceUuid);

            statusText.innerText = '狀態: 正在獲取特徵值...';
            characteristic = await service.getCharacteristic(characteristicUuid);

            // 開啟通知 (Notification) 嚟自動接收數據
            await characteristic.startNotifications();
            characteristic.addEventListener('characteristicvaluechanged', handleData);

            statusText.innerText = '狀態: 已成功連接！';
            connectBtn.disabled = true;
            disconnectBtn.disabled = false;

        } catch (error) {
            console.error(error);
            statusText.innerText = '狀態: 連接失敗或已取消 (' + error.message + ')';
        }
    });

    disconnectBtn.addEventListener('click', () => {
        if (bluetoothDevice && bluetoothDevice.gatt.connected) {
            bluetoothDevice.gatt.disconnect();
        }
    });

    function onDisconnected() {
        statusText.innerText = '狀態: 裝置已斷線';
        dataDisplay.innerText = '等待連接...';
        connectBtn.disabled = false;
        disconnectBtn.disabled = true;
    }

    function handleData(event) {
        // 將接收到嘅二進制數據轉換為文字
        const value = event.target.value;
        const decoder = new TextDecoder('utf-8');
        const dataString = decoder.decode(value);
        
        // 顯示喺網頁上
        dataDisplay.innerText = dataString;
    }
</script>

</body>
</html>
